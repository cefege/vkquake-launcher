name: Bug report
description: Report a reproducible vkQuake Launcher problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not upload copyrighted Quake game data.
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "macOS 26.0"
    validations:
      required: true
  - type: input
    id: vkquake
    attributes:
      label: vkQuake version
      placeholder: "1.35.0"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the selected campaign, mod, or BSP and the exact launcher warning.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
